name: OpenCode Security / NPM Release

on:
  push:
    tags:
      - "npm-v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Enable pnpm
        shell: bash
        run: corepack enable pnpm && corepack prepare pnpm@11.13.1 --activate

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^npm-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "npm release tags must identify a stable release, such as npm-v0.1.1." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#npm-v}"
          package_version="$(node -p 'require("./sdk/typescript/package.json").version')"
          if [[ "$version" != "$package_version" ]]; then
            echo "npm release tag $version must match package version $package_version." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "npm release tags must point to a commit on main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify
        run: |
          pnpm --dir sdk/typescript run types
          pnpm --dir sdk/typescript run test
          pnpm --dir sdk/typescript run format
          pnpm --dir sdk/typescript run build

      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist

      - name: Inspect package
        working-directory: sdk/typescript
        shell: bash
        run: pnpm run check:package ../../dist/*.tgz

      - name: Smoke test package
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          printf '%s\n' '{"name":"opencode-security-smoke","private":true,"type":"module"}' > "$consumer/package.json"
          npm install --ignore-scripts --prefix "$consumer" --include=optional --no-audit --no-fund ./dist/*.tgz
          (cd "$consumer" && node --input-type=module --eval 'const sdk = await import("opencode-security"); if (typeof sdk.OpenCodeSecurity !== "function") process.exit(1);')
          "$consumer/node_modules/.bin/opencode-security" --version
          "$consumer/node_modules/.bin/opencode-security" --help

      - name: Upload verified package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify bundled trusted-publishing npm
        shell: bash
        run: |
          set -euo pipefail
          node --eval '
            const version = process.argv[1];
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            const [major, minor, patch] = match?.slice(1).map(Number) ?? [];
            if (
              !match ||
              major < 11 ||
              (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
            ) {
              console.error(
                "npm 11.5.1 or newer is required for trusted publishing; found " +
                  version +
                  ".",
              );
              process.exit(1);
            }
          ' "$(npm --version)"

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist
          merge-multiple: true
          digest-mismatch: error

      - name: Publish initial npm release
        if: github.ref_name == 'npm-v0.1.1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Configure NPM_FIRST_PUBLISH_TOKEN in the protected npm environment before the initial release." >&2
            exit 1
          fi
          npm publish ./dist/*.tgz --provenance --access public --tag latest

      - name: Publish to npm using trusted publishing
        if: github.ref_name != 'npm-v0.1.1'
        run: npm publish ./dist/*.tgz --provenance --access public --tag latest
